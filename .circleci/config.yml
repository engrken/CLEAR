version: 2.1

jobs:
  web:
    docker:
      - image: cimg/node:22.23
    working_directory: ~/project
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - checkout
      - run:
          name: Check whether web is affected by this change
          command: |
            set -euo pipefail
            if bash scripts/ci/check-impact.sh web; then
              echo 'CI impact: required tests will execute.'
            else
              status=$?
              if [ "$status" -eq 10 ]; then
                echo 'CI impact: safely completing this check without a full build.'
                circleci-agent step halt
              else
                exit "$status"
              fi
            fi
      - run:
          name: Verify conservative change-impact rules
          command: bash scripts/ci/test-impact.sh
      - restore_cache:
          keys:
            - v1-web-npm-{{ checksum "package-lock.json" }}
      - run:
          name: Install web dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: v1-web-npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build Next.js application
          command: npm run build
      - run:
          name: Report Next.js traced server output sizes (non-blocking audit)
          command: node scripts/ci/report-function-traces.mjs
      - run:
          name: Run standalone source regression tests
          command: node scripts/ci/run-clear-acceptance.mjs
      - run:
          name: Verify timezone contracts in UTC and Asia/Manila
          command: |
            set -euo pipefail
            TZ=UTC npm run test:time
            TZ=Asia/Manila npm run test:time
      - run:
          name: Lint web application (existing debt baseline)
          command: |
            # Run the actual root lint command. The initial CircleCI run recorded
            # 474 errors and 2345 warnings in existing source; don't hide the log.
            # This temporary baseline fails on any increase, or if lint crashes.
            set +e
            npm run lint > /tmp/clear-web-eslint.log 2>&1
            lint_exit=$?
            set -e
            tail -n 60 /tmp/clear-web-eslint.log
            if [ "$lint_exit" -eq 0 ]; then
              echo "Web ESLint passed without errors."
              exit 0
            fi
            summary="$(grep -E '[0-9]+ problems? \([0-9]+ errors?, [0-9]+ warnings?\)' /tmp/clear-web-eslint.log | tail -n 1 || true)"
            if [ -z "$summary" ]; then
              echo "ESLint failed without a recognizable results summary."
              exit "$lint_exit"
            fi
            errors="$(printf '%s\n' "$summary" | sed -nE 's/.*\(([0-9]+) errors?, [0-9]+ warnings?\).*/\1/p')"
            warnings="$(printf '%s\n' "$summary" | sed -nE 's/.*\([0-9]+ errors?, ([0-9]+) warnings?\).*/\1/p')"
            if [ -z "$errors" ] || [ -z "$warnings" ]; then
              echo "Failed to parse ESLint results."
              exit 1
            fi
            echo "Existing web lint debt: $errors errors, $warnings warnings (baseline limits: 474/2345)."
            if [ "$errors" -gt 474 ] || [ "$warnings" -gt 2345 ]; then
              echo "Web lint debt grew above its baseline; failing the job."
              exit 1
            fi
            echo "Web lint debt did not grow. This is NOT a clean lint pass."
      - store_artifacts:
          path: /tmp/clear-web-eslint.log
          destination: lint/web-eslint.log

  mobile:
    docker:
      - image: cimg/node:22.23
    working_directory: ~/project
    environment:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - checkout
      - run:
          name: Check whether mobile is affected by this change
          command: |
            set -euo pipefail
            if bash scripts/ci/check-impact.sh mobile; then
              echo 'CI impact: required tests will execute.'
            else
              status=$?
              if [ "$status" -eq 10 ]; then
                echo 'CI impact: safely completing this check without a full build.'
                circleci-agent step halt
              else
                exit "$status"
              fi
            fi
      - restore_cache:
          keys:
            - v1-mobile-npm-{{ checksum "mobile/package-lock.json" }}
      - run:
          name: Install Expo dependencies
          command: |
            cd mobile
            # Existing GitHub CI reconciles the mobile lockfile before npm ci.
            # Restore the committed lockfile afterwards to keep cache keys stable.
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci --no-audit --no-fund
            git restore -- package-lock.json
      - save_cache:
          key: v1-mobile-npm-{{ checksum "mobile/package-lock.json" }}
          paths:
            - ~/.npm
      # mobile/package.json has no build or test script; existing CI checks TypeScript.
      - run:
          name: Type-check Expo application
          command: cd mobile && npm run typecheck
      - run:
          name: Lint Expo application
          command: cd mobile && npm run lint


  student-auth-security:
    # Real student OTP/clearance HTTP tests with a disposable database and local SMTP.
    docker:
      - image: cimg/node:22.23
      - image: postgres:16
        environment:
          POSTGRES_USER: student_ci
          POSTGRES_PASSWORD: student_ci
          POSTGRES_DB: student_ci
    working_directory: ~/project
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://student_ci:student_ci@127.0.0.1:5432/student_ci?schema=public
      AUTH_SECRET: ci-only-student-clearance-strong-test-secret-2026
      NEXTAUTH_SECRET: ci-only-student-clearance-strong-test-secret-2026
      AUTH_URL: http://127.0.0.1:3112
      AUTH_TRUST_HOST: "true"
      SUPER_ADMIN_EMAIL: ci-superadmin@example.invalid
      CLEAR_CI_STUDENT_AUTH_TEST_ENABLED: "1"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_USER: ci-only-student-auth
      SMTP_PASSWORD: ci-only-not-a-real-password
      MAIL_FROM: "CLEAR CI <ci-clear@example.invalid>"
    steps:
      - checkout
      - run:
          name: Check whether student-auth-security is affected by this change
          command: |
            set -euo pipefail
            if bash scripts/ci/check-impact.sh student-auth-security; then
              echo 'CI impact: required tests will execute.'
            else
              status=$?
              if [ "$status" -eq 10 ]; then
                echo 'CI impact: safely completing this check without a full build.'
                circleci-agent step halt
              else
                exit "$status"
              fi
            fi
      - restore_cache:
          keys:
            - v1-web-npm-{{ checksum "package-lock.json" }}
      - run:
          name: Install student runtime dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Wait for disposable PostgreSQL
          command: |
            set -euo pipefail
            for i in $(seq 1 60); do
              if node -e 'const s=require("node:net").connect(5432,"127.0.0.1");s.on("connect",()=>{s.end();process.exit(0)});s.on("error",()=>process.exit(1));s.setTimeout(2000,()=>process.exit(1))'; then exit 0; fi
              sleep 1
            done
            exit 1
      - run:
          name: Rehearse committed migrations and reject schema drift
          command: |
            npx prisma migrate deploy
            npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run:
          name: Build authenticated student API
          command: npm run build
      - run:
          name: Test real student authentication and clearance privacy against synthetic records
          command: node --test tests/ci-student-clearance-runtime.test.mjs

  financial-security:
    # GitHub Actions quota-independent equivalent of the isolated financial
    # migration and signed-action regression checks. Never connect to Neon.
    docker:
      - image: cimg/node:22.23
      - image: postgres:16
        environment:
          POSTGRES_USER: clear_ci
          POSTGRES_PASSWORD: clear_ci
          POSTGRES_DB: clear_ci
    working_directory: ~/project
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://clear_ci:clear_ci@127.0.0.1:5432/clear_ci?schema=public
      AUTH_SECRET: ci-only-circle-finance-auth-key-not-for-production
      NEXTAUTH_SECRET: ci-only-circle-finance-auth-key-not-for-production
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: "true"
      SUPER_ADMIN_EMAIL: ci-super-admin@example.invalid
      CLEAR_CI_FINANCE_TEST_ENABLED: "1"
      CLEAR_DB_AUDIT_SCOPE: isolated
    steps:
      - checkout
      - run:
          name: Check whether financial-security is affected by this change
          command: |
            set -euo pipefail
            if bash scripts/ci/check-impact.sh financial-security; then
              echo 'CI impact: required tests will execute.'
            else
              status=$?
              if [ "$status" -eq 10 ]; then
                echo 'CI impact: safely completing this check without a full build.'
                circleci-agent step halt
              else
                exit "$status"
              fi
            fi
      - restore_cache:
          keys:
            - v1-web-npm-{{ checksum "package-lock.json" }}
      - run:
          name: Install financial security test dependencies
          command: npm ci --no-audit --no-fund

      - run:
          name: Await isolated PostgreSQL service
          command: |
            set -euo pipefail
            ready=0
            for i in $(seq 1 60); do
              if node -e 'const s=require("node:net").connect(5432,"127.0.0.1");s.on("connect",()=>{s.end();process.exit(0)});s.on("error",()=>process.exit(1));s.setTimeout(2000,()=>process.exit(1))'; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" -eq 1 || (echo "Isolated PostgreSQL did not start" && exit 1)
      - run:
          name: Rehearse committed Prisma migrations and verify zero schema drift
          command: |
            set -euo pipefail
            npx prisma migrate deploy
            npx prisma migrate status
            npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run:
          name: Verify receipt sequence and idempotent payment concurrency (isolated PostgreSQL)
          command: bash scripts/ci/receipt-concurrency-circleci.sh
      - run:
          name: Seed synthetic finance records and run isolated audit
          command: |
            set -euo pipefail
            node tests/ci-financial-seed.mjs
            node scripts/finance-readonly-audit.mjs
      - run:
          name: Test real signed cashier and remittance concurrency
          command: |
            set -euo pipefail
            # This guarded route exists ONLY in this disposable CI job.
            mkdir -p app/api/clear-ci-finance
            cp tests/ci-financial-route.ts app/api/clear-ci-finance/route.ts
            # Test-only routes are created after checkout and never committed to
            # app/api. Both benchmark paths share identical handler code.
            mkdir -p app/api/auth/ci-maintenance-bench app/api/ci-maintenance-bench app/api/ci-maintenance-admin-negative
            cp tests/ci-maintenance-bench-route.ts app/api/auth/ci-maintenance-bench/route.ts
            cp tests/ci-maintenance-bench-route.ts app/api/ci-maintenance-bench/route.ts
            cp tests/ci-maintenance-negative-route.ts app/api/ci-maintenance-admin-negative/route.ts
            export CLEAR_CI_FINANCE_TEST_TOKEN="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
            npm run build
            npm run start -- -H 127.0.0.1 -p 3100 >/tmp/clear-ci-finance-server.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            ready=0
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:3100/api/auth/session >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Isolated Next.js server failed to start"
              tail -n 80 /tmp/clear-ci-finance-server.log
              exit 1
            fi
            node --experimental-strip-types --test tests/ci-financial-actions.test.mjs
            node --test tests/ci-mobile-ledger-http.test.mjs
            node --test tests/ci-mobile-finance-review-http.test.mjs
            node --test tests/ci-mobile-collectibles-http.test.mjs
            node --test tests/ci-maintenance-http.test.mjs
            node --test tests/ci-maintenance-admin-negative.test.mjs
            node --test tests/ci-maintenance-proxy-benchmark.test.mjs
            node --experimental-strip-types --test tests/ci-mobile-payment-denied-http.test.mjs
            # Ephemeral, scoped roster UAT server. Production environment remains
            # untouched; this job only uses local synthetic Postgres fixtures.
            VERCEL_ENV=preview VERCEL_GIT_COMMIT_REF=feature/android-v1.5.0-write-foundation-20261101 MOBILE_STUDENT_ROSTER_WRITES_ENABLED=true MOBILE_TENANT_USER_WRITES_ENABLED=true MOBILE_TENANT_USER_MANAGE_WRITES_ENABLED=true MOBILE_ACADEMIC_SETTINGS_WRITES_ENABLED=true MOBILE_REPORT_SIGNATORY_WRITES_ENABLED=true \
              npm run start -- -H 127.0.0.1 -p 3103 >/tmp/clear-ci-roster-server.log 2>&1 &
            roster_server_pid=$!
            trap 'kill "$roster_server_pid" "$server_pid" 2>/dev/null || true' EXIT
            ready=0
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:3103/api/auth/session >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Isolated roster UAT server failed to start"
              tail -n 80 /tmp/clear-ci-roster-server.log
              exit 1
            fi
            node --test tests/ci-mobile-roster-http.test.mjs
            node --test tests/ci-mobile-users-http.test.mjs
            node --test tests/ci-mobile-academic-calendar-http.test.mjs
            node --test tests/ci-mobile-report-setup-http.test.mjs
      - store_artifacts:
          path: /tmp/clear-ci-roster-server.log
          destination: roster/ci-server.log
      - store_artifacts:
          path: /tmp/clear-ci-finance-server.log
          destination: finance/ci-server.log
      - store_artifacts:
          path: /tmp/clear-ci-maintenance-benchmark.json
          destination: performance/maintenance-proxy-benchmark.json

workflows:
  starter:
    jobs:
      - web
      - mobile
      - financial-security
      - student-auth-security
