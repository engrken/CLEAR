name: Temporary SaaS policy diagnostic (no deployment)
on:
  push:
    branches:
      - feature/saas-option-b-policy-20261103
    paths:
      - '.github/workflows/saas-policy-debug-once.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test Option B standalone pure policy
        run: node --experimental-strip-types --test tests/saas-option-b-policy.test.mjs
      - name: Run source acceptance tests
        run: node scripts/ci/run-clear-acceptance.mjs
      - name: Compile web app
        run: npm run build
