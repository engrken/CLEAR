name: CLEAR Android EAS preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eas-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the EXPO_TOKEN GitHub Actions secret."
            exit 1
          fi
      - name: Install Expo dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Configure EAS CLI
        run: npm install --global eas-cli
      - name: Queue internal preview APK on Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --no-wait
