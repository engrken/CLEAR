name: Android access and TypeScript validation

on:
  push:
    branches:
      - android-parity-integration
    paths:
      - 'app/api/mobile/global/**'
      - 'lib/mobile/**'
      - 'lib/clearance.ts'
      - 'mobile/src/**'
      - 'tests/mobile-*.test.mjs'
      - 'package.json'
      - '.github/workflows/android-access-validation.yml'
  pull_request:
    paths:
      - 'app/api/mobile/**'
      - 'lib/mobile/**'
      - 'lib/clearance.ts'
      - 'mobile/src/**'
      - 'tests/mobile-*.test.mjs'
      - 'package.json'
      - '.github/workflows/android-access-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clear-android-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  access-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies and generate Prisma client
        run: npm ci
      - name: Verify global and officer authorization policy
        run: npm run test:mobile-roles
      - name: Check web TypeScript and mobile route handlers
        run: npx tsc --noEmit
      - name: Reconcile mobile lockfile in disposable workspace
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Check Android TypeScript
        working-directory: mobile
        run: npm run typecheck
