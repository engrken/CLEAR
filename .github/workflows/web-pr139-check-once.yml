name: Temporary PR139 web validation (build and scoped lint only)
on:
  push:
    branches:
      - perf/receipt-group-paging-20261103
    paths:
      - '.github/workflows/web-pr139-check-once.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Run receipt eligibility tests
        run: node --experimental-strip-types --test tests/receipt-history-paging.test.mjs
      - name: Check changed web files lint
        run: |
          npx eslint 'app/department/[department]/(protected)/collections/history/page.tsx' 'app/department/[department]/(protected)/collections/history/paged-group-query.ts' 'lib/receipts/receipt-history-paging.ts' || true
      - name: Build web app (typecheck, fail closed)
        run: npm run build
