name: Authenticated financial concurrency integration

# Always report this gate on pull requests so a required check cannot be skipped by path filters.
# Uses an isolated local PostgreSQL service; never connects to production.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clear-financial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clear_ci
          POSTGRES_USER: clear_ci
          POSTGRES_PASSWORD: clear_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clear_ci -d clear_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clear_ci:clear_ci@127.0.0.1:5432/clear_ci?schema=public
      AUTH_SECRET: clear-ci-only-financial-auth-key-1234567890
      NEXTAUTH_SECRET: clear-ci-only-financial-auth-key-1234567890
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: 'true'
      SUPER_ADMIN_EMAIL: ci-super-admin@example.invalid
      CLEAR_CI_FINANCE_TEST_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply full Prisma migration history to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Require the complete migration history to match the application schema
        # Never silently patch the disposable database with prisma db push.
        # Failing here catches missing migrations before concurrency tests run.
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed synthetic tenant, officer and remittance
        run: node tests/ci-financial-seed.mjs
      - name: Rehearse exact-money DDL then verify rollback on synthetic PostgreSQL
        run: |
          node scripts/emit-decimal-rehearsal.mjs > /tmp/clear-decimal-rehearsal.sql
          # Prisma's ?schema=public URL option is not recognized by libpq/psql.
          # This is the disposable CI-only local DB: strip that ORM URL option.
          pg_dsn="${DATABASE_URL%%\?*}"
          psql "$pg_dsn" -X -v ON_ERROR_STOP=1 -f /tmp/clear-decimal-rehearsal.sql > /dev/null
          retained_type="$(psql "$pg_dsn" -X -Atc "SELECT data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='Collection' AND column_name='amountPaid'")"
          # On the synchronized Decimal branch, Prisma migrate deploy already
          # converted this synthetic schema. The extra rehearsal must roll back
          # and leave that pre-existing NUMERIC column unchanged.
          test "$retained_type" = "numeric"
      - name: Verify aggregate money and historical audit on synthetic CI database
        run: CLEAR_DB_AUDIT_SCOPE=isolated node scripts/finance-readonly-audit.mjs
      - name: Measure synthetic staging SQL only (no PII)
        run: CLEAR_DB_AUDIT_SCOPE=isolated node scripts/finance-readonly-audit.mjs --benchmark
      - name: Validate exact-centavo financial fingerprints against disposable PostgreSQL
        run: |
          set -euo pipefail
          export CLEAR_DB_AUDIT_SCOPE=isolated
          export CLEAR_CUTOVER_AUDIT_KEY=ci-disposable-fingerprint-audit-key-do-not-use-in-production
          node scripts/finance-cutover-fingerprint.mjs > /tmp/clear-ci-money-fingerprint.json
          node scripts/finance-cutover-fingerprint.mjs --compare /tmp/clear-ci-money-fingerprint.json
      - name: Generate CI-only route and ephemeral request token
        run: |
          mkdir -p app/api/clear-ci-finance
          cp tests/ci-financial-route.ts app/api/clear-ci-finance/route.ts
          echo "CLEAR_CI_FINANCE_TEST_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build real Next.js app with CI-only action adapter
        run: npm run build
      - name: Run authenticated concurrent cashier and remittance actions
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3100 > /tmp/clear-ci-app.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3100/api/auth/session >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if test "$ready" -ne 1; then
            echo "Isolated Next.js server never became ready"
            tail -n 80 /tmp/clear-ci-app.log
            exit 1
          fi
          node --test tests/ci-financial-actions.test.mjs
      - name: Verify maintenance mode blocks login, existing JWT sessions, mobile routes and financial POSTs
        run: |
          set -euo pipefail
          CLEAR_MAINTENANCE_MODE=locked npm run start -- -H 127.0.0.1 -p 3101 > /tmp/clear-ci-maintenance.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/maintenance || true)" = "200"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1 || (echo "Maintenance page was not ready" && exit 1)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/api/auth/session)" = "503"
          test "$(curl -s -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/api/auth/callback/credentials)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/api/mobile/orgs/test/auth/session)" = "503"
          test "$(curl -s -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/department/test/collections)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/department/test/clearance)" = "307"
      - name: Confirm CI-only adapter never belongs to repository code
        run: |
          test ! -e tests/../app/api/clear-ci-finance/route.ts || test "$CLEAR_CI_FINANCE_TEST_ENABLED" = "1"
          git ls-files --error-unmatch app/api/clear-ci-finance/route.ts >/dev/null 2>&1 && exit 1 || exit 0
