name: Android Gradle validation (unsigned)

on:
  push:
    branches:
      - android-parity-integration
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-gradle-validation.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://clear.rupertbulquerin.com/api/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on GitHub runner
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Using SDK at $ANDROID_HOME"
      - name: Reconcile dependency lockfile in disposable CI workspace
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install pinned Expo dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Generate native Android project without publishing
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build unsigned debug APK with Gradle
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        working-directory: mobile/android
      - name: Upload debug APK for internal validation only
        uses: actions/upload-artifact@v4
        with:
          name: clear-android-debug-unverified
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
