name: Android Gradle validation (unsigned)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-gradle-validation.yml'

permissions:
  contents: read

jobs:
  android-debug:
    if: ${{ hashFiles('mobile/package-lock.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: https://clear.rupertbulquerin.com/api/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Expo dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Generate native Android project without publishing
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build unsigned debug APK with Gradle
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        working-directory: mobile/android
      - name: Upload debug APK for internal validation only
        uses: actions/upload-artifact@v4
        with:
          name: clear-android-debug-unverified
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
